name: Manual Release (SkillsMonitor)

on:
  workflow_dispatch:

permissions:
  contents: write  # needed to push a tag and create a release

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # we need full history to push a tag

      - name: Extract version from Locales.lua
        id: addonVersion
        shell: bash
        run: |
          set -euo pipefail

          metadata_key_for() {
            local variable="$1"
            local key
            key=$(sed -nE "s/^local ${variable}[[:space:]]*=[[:space:]]*C_AddOns.GetAddOnMetadata\\(ADDON_NAME,[[:space:]]*\"([^\"]+)\"\\).*/\\1/p" Locales.lua)
            if [[ -z "$key" ]]; then
              echo "Metadata key for '$variable' not found in Locales.lua." >&2
              exit 1
            fi
            printf '%s' "$key"
          }

          metadata_value_for() {
            local key="$1"
            local value
            value=$(awk -F: -v key="$key" '
              $1 ~ "^##[[:space:]]*" key "$" {
                sub(/^[^:]*:[[:space:]]*/, "")
                sub(/\r$/, "")
                gsub(/[[:space:]]+$/, "")
                print
                exit
              }
            ' SkillsMonitor.toc)
            if [[ -z "$value" ]]; then
              echo "Metadata value for '$key' not found in SkillsMonitor.toc." >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          MAJOR=$(metadata_value_for "$(metadata_key_for majorVersion)")
          MINOR=$(metadata_value_for "$(metadata_key_for minorVersion)")
          PATCH=$(metadata_value_for "$(metadata_key_for patchVersion)")
          VER="${MAJOR}.${MINOR}.${PATCH}"

          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "zip=SkillsMonitor-v${VER}-master.zip" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER"

      - name: Stage addon files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/SkillsMonitor

          # Normalize line endings in case the .toc was committed with CRLF
          # (sed will rewrite the file without \r)
          sed -i 's/\r$//' SkillsMonitor.toc

          # Always include the .toc
          cp SkillsMonitor.toc dist/SkillsMonitor/

          # Copy files listed in the .toc (skip comments/blank lines)
          # Trim leading/trailing whitespace and strip any trailing \r just in case
          awk '!/^[[:space:]]*##/ && !/^[[:space:]]*#/ && NF {print}' SkillsMonitor.toc | while IFS= read -r line; do
            f="${line%$'\r'}"
            # trim
            f="$(printf '%s' "$f" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "ERROR: '$f' listed in SkillsMonitor.toc but not found."
              exit 1
            fi
            cp "$f" dist/SkillsMonitor/
          done

          # Optionally include README and LICENSE if present
          [ -f README.md ] && cp README.md dist/SkillsMonitor/
          [ -f LICENSE ] && cp LICENSE dist/SkillsMonitor/

          echo "Staged contents:"
          ls -la dist/SkillsMonitor

      - name: Create zip
        shell: bash
        run: |
          cd dist
          zip -r "${{ steps.addonVersion.outputs.zip }}" SkillsMonitor
          mv "${{ steps.addonVersion.outputs.zip }}" ..
          cd ..
          echo "Created ${{ steps.addonVersion.outputs.zip }}"

      - name: Create tag
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If the tag already exists, exit explicitly to avoid a failing push
          if git rev-parse "${{ steps.addonVersion.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.addonVersion.outputs.tag }} already exists. Aborting."
            exit 1
          fi
          git tag -a "${{ steps.addonVersion.outputs.tag }}" -m "Release ${{ steps.addonVersion.outputs.tag }}"
          git push origin "${{ steps.addonVersion.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.addonVersion.outputs.tag }}
          name:      SkillsMonitor ${{ steps.addonVersion.outputs.tag }}
          draft:     false
          prerelease: false
          files:     ${{ steps.addonVersion.outputs.zip }}
